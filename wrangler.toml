name = "gerrithub-ci"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Nothing about a particular deployment lives here, so anyone can deploy this
# repository as it is. Set these with `npx wrangler secret put NAME`:
#
#   GITHUB_APP_ID           the GitHub App that sends the dispatches
#   GITHUB_APP_PRIVATE_KEY  its private key, the .pem GitHub gives you
#                           (`npx wrangler secret put GITHUB_APP_PRIVATE_KEY < app.pem`)
#   PROJECTS                JSON: Gerrit project name -> GitHub "owner/repo", e.g.
#                           {"go-valkyrie/vali-scheme": "go-valkyrie/vali-scheme"}
#   TRUSTED                 JSON: Gerrit usernames or emails whose patch sets run CI
#                           without a "recheck", e.g. ["alice", "bob@example.com"]
#   WEBHOOK_SECRET          the path segment GerritHub posts to (/gerrit/<secret>)
#   TICKET_SECRET           signs the ticket each dispatch carries and each vote returns
#   GERRIT_USER             the GerritHub bot account that votes Verified
#   GERRIT_HTTP_PASSWORD    its HTTP password
#
# Optional, with their defaults; set the same way to change them:
#   GERRIT_URL      https://review.gerrithub.io
#   EVENT_TYPE      gerrit-verify
#   OIDC_AUDIENCE   gerrithub-ci
#   WORKFLOW        .github/workflows/gerrit-verify.yml   (the only workflow allowed to vote)
#   BRANCH          main                                  (...and the branch it must run from)
#   DEDUPE_WINDOW_SECONDS  600   (how long an event is remembered, so repeat deliveries are dropped)
#
# Optional, for the Muse-review proxy (all unset, and /v1/* answers 501,
# /github-webhook answers 404, while /vote and /review keep working):
#   LLM_API_KEY            the key the proxy swaps in for /v1/* calls
#   LLM_BASE_URL           https://api.meta.ai/v1 (the API /v1/* forwards to)
#   MUSE_TOKEN_SECRET      signs the ephemeral review tokens (defaults to TICKET_SECRET)
#   MUSE_TOKEN_TTL_SECONDS 1800 (ephemeral token lifetime, at most 3600)
#   GITHUB_WEBHOOK_SECRET  verifies the workflow_job webhook's HMAC signature
#
# For local development, put them in .dev.vars (gitignored).

# The Worker reports what it did with each webhook event in its logs; keep them.
[observability]
enabled = true

# De-duplicates the several deliveries of each event (see src/claims.ts). One
# Durable Object per event, deleted after the window; SQLite-backed, so it
# works on the Workers Free plan.
[[durable_objects.bindings]]
name = "EVENT_CLAIM"
class_name = "EventClaim"

# Tracks each run's review-token state (see src/muse.ts). One Durable Object
# per run, named after it, so every isolate sees the same revocation; entries
# expire with the token lifetime. SQLite-backed, like the claims above.
[[durable_objects.bindings]]
name = "MUSE_TOKENS"
class_name = "MuseTokens"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventClaim"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MuseTokens"]
